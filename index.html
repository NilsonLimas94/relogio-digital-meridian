<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Relógio Digital Meridian</title>
</head>
<body>
    <!-- 
    Camada de ruído visual.
    aria-hidden: leitor de tela ignora.
    É só decoração.
    -->
    <div class="grain" aria-hidden="true"></div>

    <!-- Main é o cartão do relógio. Tudo do relógio esta aqui dentro -->
    <main>
        <header class="top">
            <!-- 
            brand: identidade visual. 
            Fica à esquerda por convenção 
            -->
            <div class="brand">
                <span class="mark">M</span>
                <span>MERIDIAN / 01</span>
            </div>
            <!--
            Zone: informação de contexto. Fica à direita para separar de marca
            -->
            <div class="zone">
                FUSO LOCAL
                <span aria-hidden="true">.</span>
                BR
            </div>
        </header>
        <!-- 
        Center: região principa. aria-label ajuda leitor de tela a entender que aqui esta relógio
        -->
        <section class="center" aria-label="Relógio digital">
            <!-- 
            Eyebrow: texto pequeno acima. Guia visual antes da hora
            -->
            <div class="eyebrow">
                Agora, com calma
            </div>
            <div class="time" aria-label="Hora atual">
                <span id="hours">00</span>
                <span class="sep" aria-hidden="true">:</span>
                <span id="minutes">00</span>
                <span class="sep" aria-hidden="true">:</span>
                <span id="seconds" class="seconds">00</span>
            </div>
            <div class="date" id="date">
                Carregando data...
            </div>
            <!-- 
            Rule: linha decorativa. Separa data do texto abaixo
            -->
            <div class="rule"></div>
            <div class="caption">
                O seu tempo, em um só lugar.
            </div>
        </section>

        <footer class="bottom">
            <!-- 
            Live: indicador de tempo real. Dot com brilho indica ativo
            -->
            <div class="live">
                <span class="dot"></span>
                <span>TEM TEMPO REAL</span>
            </div>
            <!-- 
            motion-toggle: controla orbs. type="button" evita submit acidental
            -->
            <button class="motion-toggle" id="motion-toggle" type="button">
                PAUSAR LUZES
            </button>
            <!-- 
            Cords: informação extra. Mantém simetria com o header
            -->
            <div class="coords">
                HORÁRIO DE BRASILIA
            </div>
        </footer>
    </main>

    <!-- 
    Defer: Garante que o HTML carregue antes do JS executar. Evita getElementById nulo.
    -->
    <script src="script.js" defer></script>
</body>
</html>
